# Use the macOS GUI pinentry so the passphrase can be saved to the login
# Keychain (no re-prompting), and so non-interactive callers can prompt too.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Longer caches so a working session rarely re-asks even if Keychain is locked.
default-cache-ttl 3600
max-cache-ttl 28800
